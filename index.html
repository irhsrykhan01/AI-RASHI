<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI RASHI</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:#1f2937;
padding:15px;
border-radius:12px;
margin:10px 0;
}

textarea{
width:100%;
height:180px;
padding:10px;
border:none;
border-radius:8px;
background:#0f172a;
color:white;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
margin:4px;
}

#out{
white-space:pre-wrap;
line-height:1.5;
}
</style>
</head>
<body>

<div class="card">
<h1>🤖 AI RASHI</h1>
<p>Tempel kisi-kisi lalu pilih mode.</p>
</div>

<div class="card">

<textarea id="kisi"
placeholder="Tempel kisi-kisi di sini"></textarea>

<br><br>

<button onclick="belajar()">📖 Belajar</button>
<button onclick="latihan()">🎯 Latihan</button>
<button onclick="ujian()">📝 Ujian</button>

</div>

<div class="card">
<div id="out">
Selamat datang di AI RASHI 🚀
</div>
</div>

<script>

async function kirim(prompt){

const out =
document.getElementById("out");

out.innerText =
"⏳ Meminta Gemini...";

try{

const response =
await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
text:prompt
})
});

const data =
await response.json();

out.innerText =
data.reply || "Tidak ada jawaban";

}catch(error){

out.innerText =
"❌ Gagal terhubung ke AI";

console.error(error);

}

}

function belajar(){

const kisi =
document.getElementById("kisi").value;

kirim(
"Jelaskan materi berikut untuk siswa SMP:\n\n"+kisi
);

}

function latihan(){

const kisi =
document.getElementById("kisi").value;

kirim(
"Buat 10 soal latihan dari materi berikut tanpa jawaban:\n\n"+kisi
);

}

function ujian(){

const kisi =
document.getElementById("kisi").value;

kirim(
"Buat ujian 40 soal dari materi berikut tanpa jawaban:\n\n"+kisi
);

}

</script>

</body>
</html>
